/* SUMMARY DETAILS */

.trip-details {
    display: grid;
    grid-template-columns: repeat(4, max-content);
    justify-content: center;

    width: fit-content;
    max-width: 100%;
    margin: 0 auto;

    background: #f7f7f7;
    border: 1px solid #d6d6d6;

    overflow: hidden;
}

.trip-detail {
    padding: 16px 28px;
    border-right: 1px solid #ddd;
    white-space: nowrap;
}

.trip-detail:last-child {
    border-right: none;
}

.detail-label {
    display: block;
    margin-bottom: 7px;

    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;

    color: #777;
}

.detail-value {
    display: block;

    font-size: 17px;
    line-height: 1.35;
    color: #222;

    white-space: nowrap;
}


/* WRITE-UP PARAGRAPHS */

.trip-story .caption {
    margin: 0 0 20px;
    font-size: 16px;
    line-height: 1.7;
}

.trip-story .caption:last-child {
    margin-bottom: 0;
}


/* MAP */

.trip-map iframe {
    display: block;
    pointer-events: none;
}


/* MOBILE */

@media (max-width: 700px) {

    .trip-details {
        display: grid;
        grid-template-columns: repeat(2, 1fr);

        width: 100%;
    }

    .trip-detail {
        padding: 16px;
        white-space: normal;
    }

    .detail-value {
        white-space: normal;
    }

}

</style>

     TRIP DATA
========================================== -->

<script>

const TRIP_NAME = "Mica Mountain";

const DATA_URL =
    "https://script.google.com/macros/s/AKfycbxmcar1lRakOBIXfemcSlT_9yMDL5ZVcrEeKs1tr7cuEoD6I8T6Y8_wLR-FHGbAm0zF/exec";


async function loadTripSummary() {

    try {

        const response =
            await fetch(DATA_URL);


        if (!response.ok) {

            throw new Error(
                "Could not load trip data."
            );

        }


        const data =
            await response.json();


        if (!data.mapMarkers) {

            throw new Error(
                "Trip data does not contain mapMarkers."
            );

        }


        const trip =
            data.mapMarkers.find(
                item =>
                    item.title === TRIP_NAME
            );


        if (!trip) {

            throw new Error(
                "Mica Mountain was not found in the trip data."
            );

        }



        /* ==============================
           DATE
        ============================== */

        document.getElementById(
            "trip-date"
        ).textContent =
            trip.date || "";



        /* ==============================
           TYPE
        ============================== */

        document.getElementById(
            "trip-type"
        ).textContent =
            trip.type || "";



        /* ==============================
           MILES
        ============================== */

        document.getElementById(
            "trip-miles"
        ).textContent =
            trip.miles
                ? trip.miles + " mi"
                : "";



        /* ==============================
           ELEVATION
        ============================== */

        if (trip.elevationGain) {

            const elevation =
                Number(
                    String(
                        trip.elevationGain
                    ).replace(
                        /,/g,
                        ""
                    )
                );


            document.getElementById(
                "trip-elevation"
            ).textContent =
                Number.isNaN(elevation)
                    ? trip.elevationGain + " ft"
                    : elevation.toLocaleString() + " ft";

        }



        /* ==============================
           WHERE
        ============================== */

        document.getElementById(
            "trip-where"
        ).textContent =
            trip.area || "";



        /* ==============================
           WRITE-UP
        ============================== */

        const writeUp =
            trip.WriteUp ??
            trip.writeUp ??
            trip.writeup ??
            "";


        const writeupContainer =
            document.getElementById(
                "trip-writeup"
            );


        if (writeUp) {

            const paragraphs =
                String(writeUp)
                    .replace(/\r\n/g, "\n")
                    .replace(/\r/g, "\n")
                    .split(/\n+/)
                    .map(
                        paragraph =>
                            paragraph.trim()
                    )
                    .filter(
                        paragraph =>
                            paragraph.length > 0
                    );


            paragraphs.forEach(
                paragraphText => {

                    const paragraph =
                        document.createElement(
                            "p"
                        );


                    paragraph.className =
                        "caption";


                    paragraph.textContent =
                        paragraphText;


                    writeupContainer.appendChild(
                        paragraph
                    );

                }
            );

        }



        /* ==============================
           COVER PHOTO
        ============================== */

        if (trip.photoUrl) {

            const cover =
                document.createElement(
                    "img"
                );


            cover.src =
                trip.photoUrl;


            cover.alt =
                trip.title;


            cover.className =
                "trip-cover";


            document.getElementById(
                "trip-cover-container"
            ).appendChild(
                cover
            );

        }



        /* ==============================
           MAP
        ============================== */

        if (
            trip.position &&
            trip.position.lat !== undefined &&
            trip.position.lng !== undefined
        ) {

            createTripMap(
                trip.position
            );

        }


    } catch (error) {

        console.error(
            "Trip page error:",
            error
        );

    }

}



function createTripMap(position) {

    const lat =
        Number(position.lat);

    const lng =
        Number(position.lng);


    if (
        Number.isNaN(lat) ||
        Number.isNaN(lng)
    ) {

        console.error(
            "Invalid map coordinates:",
            position
        );

        return;

    }



    /* ==============================
       EMBEDDED MAP
    ============================== */

    const mapContainer =
        document.getElementById(
            "trip-map"
        );


    const iframe =
        document.createElement(
            "iframe"
        );


    iframe.src =
        "https://www.google.com/maps?q=" +
        encodeURIComponent(
            lat + "," + lng
        ) +
        "&z=11&output=embed";


    iframe.width =
        "100%";


    iframe.height =
        "100%";


    iframe.style.border =
        "0";


    iframe.loading =
        "lazy";


    iframe.referrerPolicy =
        "no-referrer-when-downgrade";


    iframe.tabIndex =
        -1;


    mapContainer.replaceChildren(
        iframe
    );



    /* ==============================
       GOOGLE MAPS LINK
    ============================== */

    const mapLink =
        document.getElementById(
            "trip-map-link"
        );


    mapLink.href =
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(
            lat + "," + lng
        );

}



loadTripSummary();

</script>
