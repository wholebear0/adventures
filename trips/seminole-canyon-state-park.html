<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seminole Canyon State Park</title>
<link rel="stylesheet" href="../assets/css/trip.css">

<style>
.trip-summary { width:100%; margin-bottom:60px; }
.trip-heading { margin-bottom:25px; }
.trip-heading h1 { margin:0 0 8px; font-size:42px; }
.trip-date { margin:0; font-size:15px; color:#777; }
.trip-cover-container { width:100%; margin:0; }
.trip-cover { display:block; width:100%; max-height:650px; object-fit:cover; }
.trip-panorama { width:100%; height:550px; background:#222; }
.trip-details { display:flex; justify-content:space-between; align-items:flex-start; width:100%; margin:0; padding:0; border:0; background:transparent; gap:12px; }
.trip-detail { flex:0 1 auto; min-width:0; margin:0; padding:18px 0; border:0; text-align:center; }
.trip-detail:first-child { text-align:left; }
.trip-detail:last-child { text-align:right; }
.detail-label { display:block; margin-bottom:6px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:#777; }
.detail-value { display:block; font-size:17px; line-height:1.35; color:#222; overflow-wrap:anywhere; }
.route-link { display:inline-flex; align-items:center; justify-content:center; min-width:28px; min-height:28px; color:#222; text-decoration:none; }
.route-link:hover, .route-link:focus-visible { color:#555; text-decoration:underline; }
.trip-map-link { display:block; position:relative; width:100%; margin-top:12px; color:#222; text-decoration:none; overflow:hidden; cursor:pointer; }
.trip-map { width:100%; height:220px; background:#ddd; }
.trip-map iframe { display:block; width:100%; height:100%; border:0; pointer-events:none; }
.trip-map-label { position:absolute; right:12px; bottom:12px; padding:8px 12px; background:rgba(255,255,255,.94); font-size:13px; font-weight:600; box-shadow:0 2px 8px rgba(0,0,0,.18); }
.trip-story { width:100%; max-width:none; margin:0 0 65px; padding:0; }
.trip-story h2 { width:100%; margin:0 0 20px; padding:0 0 12px; font-size:28px; border-bottom:1px solid #ccc; }
.trip-story .caption { width:100%; max-width:none; margin:0 0 20px; padding:0; font-size:16px; line-height:1.7; text-align:left; }
.trip-story .caption:last-child { margin-bottom:0; }
.trip-photos { width:100%; padding-top:15px; border-top:1px solid #ccc; }
.trip-photos figure:first-child { margin-top:35px; }
@media (max-width:900px) { .trip-details { flex-wrap:wrap; justify-content:flex-start; column-gap:26px; } .trip-detail, .trip-detail:first-child, .trip-detail:last-child { text-align:left; } }
@media (max-width:700px) {
  .trip-heading h1 { font-size:34px; }
  .trip-summary { margin-bottom:45px; }
  .trip-cover { max-height:450px; }
  .trip-panorama { height:350px; }
  .trip-details { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0; }
  .trip-detail, .trip-detail:first-child, .trip-detail:last-child { padding:14px 0; text-align:left; }
  .trip-detail:nth-child(even) { text-align:right; }
  .trip-detail:nth-child(5) { text-align:left; }
  .detail-value { font-size:15px; }
  .trip-map { height:190px; }
  .trip-story { margin-bottom:45px; }
  .trip-story h2 { font-size:24px; }
}
</style>
</head>
<body>

  <div class="trip-cover-container"><img class="trip-cover" src="https://res.cloudinary.com/dudbxqaxs/image/upload/v1793552398/Seminole%20Canyon%20State%20Park/X.jpg" alt="Seminole Canyon State Park"></div>

<div class="trip-detail"><span class="detail-label">Where</span><span class="detail-value">Seminole Canyon State Park, TX</span></div>
